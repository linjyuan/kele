        # server 10.10.194.26:9080;
        # 博杰
        # server 10.128.2.10:9080;
    }
    client_max_body_size 100m; 


    server {
        listen       80;
        server_name  localhost;

        location / {
            root   html;
            index  keleApp/index.html keleApp/index.htm;
            add_header Access-Control-Allow-Origin $host;
            try_files $uri $uri/ /index.html;
        }

